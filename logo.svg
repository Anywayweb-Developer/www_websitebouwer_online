<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <style>
      .brand-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        font-size: 34px;
        fill: #0a0a0a;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .brand-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        font-size: 34px;
        fill: #262626;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        font-size: 11px;
        fill: #ffffff;
        letter-spacing: 3px;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- LOGO ICON (Minimalist Wireframe) -->
  <g transform="translate(12, 12)">
    <rect x="3.5" y="3.5" width="89" height="89" rx="14" fill="none" stroke="#0a0a0a" stroke-width="7" />
    <line x1="0" y1="26" x2="96" y2="26" stroke="#0a0a0a" stroke-width="5" />
    <circle cx="16" cy="13" r="3.5" fill="#0a0a0a" />
    <circle cx="28" cy="13" r="3.5" fill="#0a0a0a" />
    <circle cx="40" cy="13" r="3.5" fill="#0a0a0a" />
    <!-- Building Blocks -->
    <rect x="14" y="38" width="14" height="42" rx="3" fill="#0a0a0a" />
    <rect x="36" y="56" width="24" height="24" rx="3" fill="#0a0a0a" />
    <rect x="68" y="38" width="14" height="42" rx="3" fill="#0a0a0a" />
    <rect x="41" y="38" width="14" height="12" rx="2" fill="#0a0a0a" />
  </g>

  <!-- TYPOGRAPHY -->
  <g transform="translate(132, 26)">
    <text x="0" y="38">
      <tspan class="brand-title">Website</tspan>
      <tspan dx="10" class="brand-subtitle">Bouwer</tspan>
    </text>

    <!-- Sub-row: ONLINE badge & descriptor -->
    <g transform="translate(2, 54)">
      <rect x="0" y="0" width="86" height="22" rx="11" fill="#0a0a0a" />
      <circle cx="14" cy="11" r="3.5" fill="#ffffff" />
      <text x="24" y="15" class="tag-text">ONLINE</text>
      <line x1="102" y1="11" x2="380" y2="11" stroke="#0a0a0a" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.35" />
    </g>
  </g>
</svg>
